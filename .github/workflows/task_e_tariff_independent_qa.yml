name: Task E independent source/measure/conditional scenario audit
on:
  push:
    paths:
      - ".github/workflows/task_e_tariff_independent_qa.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Recalculate origin tariff evidence from archived official TARIC files
        run: python task_e_tariff_matrix/qa_official_taric.py
      - name: Preserve validation result in thesis repository
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task_e_tariff_matrix/refined_v18/INDEPENDENT_TARIFF_QA.json
          if ! git diff --staged --quiet; then
            git commit -m "Save independent EU tariff measure and GSP conditional scenario QA"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
