name: Task E refined customs union and conditional GSP scenarios
on:
  push:
    paths:
      - ".github/workflows/task_e_refined_matrix.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build qualified 2026 TARIC and scheme template matrix
        run: python task_e_tariff_matrix/refine_taric_scenario.py
      - name: Archive conditional tariff matrix
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task_e_tariff_matrix/refined_v18/
          if ! git diff --staged --quiet; then
            git commit -m "Archive refined origin tariff data including customs union and conditional future GSP scenarios"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
