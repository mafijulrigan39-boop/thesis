name: Task E independently cross-validate official 2026 tariff matrix
on:
  push:
    paths:
      - ".github/workflows/task_e_independent_qa.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Verify nine official XLSX hashes and all CN8-country duty candidates
        run: python task_e_tariff_matrix/independent_check_task_e.py
      - name: Save independent quality assurance and trade-value join
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task_e_tariff_matrix/nov2026_taric/INDEPENDENT_QA_AND_CROSSCHECK.json task_e_tariff_matrix/nov2026_taric/TaskE_tariff_2026_join_2025_trade_values.csv
          if ! git diff --staged --quiet; then
            git commit -m "Independently validate official TARIC source hashes and regime rates"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
