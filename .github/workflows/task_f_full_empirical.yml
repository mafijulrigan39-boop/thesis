name: Task F execute empirical exposure, competition, growth and robustness
on:
  push:
    paths:
      - ".github/workflows/task_f_full_empirical.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  empirical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce all official trade-competitor-tariff empirical comparisons
        run: python task_f_empirical/run_empirical_analysis.py
      - name: Archive fully executed tables and source hashes
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task_f_empirical/full/
          if ! git diff --staged --quiet; then
            git commit -m "Archive Task F executed numeric empirical analysis and sensitivity"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

# Re-run after fixing historical chapter growth constant.
