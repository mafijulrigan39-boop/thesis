name: Task F independent empirical and legal denominator QA
on:
  push:
    paths:
      - ".github/workflows/task_f_independent_qa.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct official Article33 and independently verify all numerical results
        run: python task_f_empirical/qa_task_f.py
      - name: Save source-backed QA record
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task_f_empirical/full/INDEPENDENT_QA.json
          if ! git diff --staged --quiet; then
            git commit -m "Archive Task F independently verified numeric and Article33 calculations"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
