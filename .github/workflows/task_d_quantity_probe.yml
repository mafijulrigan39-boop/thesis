name: Task D Eurostat quantity indicator probe
on:
  push:
    paths:
      - ".github/workflows/task_d_quantity_probe.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Probe Comext net mass and supplementary quantity definitions
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, urllib.request, csv, io, hashlib, datetime, json, gzip
          dst=pathlib.Path("task_d_quantities/probe")
          dst.mkdir(parents=True,exist_ok=True)
          base="https://ec.europa.eu/eurostat/api/comext/dissemination/sdmx/2.1/data/DS-045409/"
          checks=[
            ("bd_2025_allindicators","A.EU27_2020.BD.61091000.1.VALUE_IN_EUROS+QUANTITY_IN_100KG+SUPPLEMENTARY_QUANTITY"),
            ("all_2025_quantities","A.EU27_2020..61091000+62034231.1.QUANTITY_IN_100KG+SUPPLEMENTARY_QUANTITY"),
            ("bd_2016_mass","A.EU27_2020.BD.61091000.1.QUANTITY_IN_100KG"),
          ]
          results=[]
          for name,key in checks:
            url=base+key+"?format=SDMX-CSV&startPeriod="+("2016" if "2016" in name else "2025")+"&endPeriod="+("2016" if "2016" in name else "2025")
            v={"name":name,"url":url,"utc":datetime.datetime.now(datetime.timezone.utc).isoformat()}
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"MITB-Academic-Eurostat-Quantity-Validation/1.0"})
              with urllib.request.urlopen(req,timeout=90) as response:
                b=response.read(20_000_000)
                v["http_status"]=response.status;v["content_type"]=response.headers.get("Content-Type")
              v["sha256"]=hashlib.sha256(b).hexdigest();v["bytes"]=len(b)
              txt=b.decode("utf-8-sig","replace")
              rows=list(csv.DictReader(io.StringIO(txt)))
              v["row_count"]=len(rows)
              v["header"]=txt.splitlines()[0] if txt.splitlines() else ""
              v["indicators"]={z:sum(row.get("indicators")==z for row in rows) for z in sorted({row.get("indicators","") for row in rows})}
              v["samples"]=rows[:8]
              (dst/(name+".csv.gz")).write_bytes(gzip.compress(b,compresslevel=6))
            except Exception as e:
              v["error"]=type(e).__name__+": "+str(e)[:500]
            results.append(v)
          (dst/"probe_receipts.json").write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2),flush=True)
          PY
      - name: Archive exact official responses and query receipts
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task_d_quantities/probe/
          if ! git diff --staged --quiet; then
            git commit -m "Archive verified Eurostat Comext quantity indicator source probe"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
