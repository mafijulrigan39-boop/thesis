name: Task D independent Eurostat source and unit-value QA
on:
  push:
    paths:
      - ".github/workflows/task_d_independent_qa.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify archived official sources and reperform kilogram/price calculations
        run: python task_d_quantities/qa_task_d.py
      - name: Archive independent QA results
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task_d_quantities/full/INDEPENDENT_QA.json
          if ! git diff --staged --quiet; then
            git commit -m "Archive independent Task D quantity and EUR/kg QA results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

# Re-run after completed 14-year quantity source extraction.
