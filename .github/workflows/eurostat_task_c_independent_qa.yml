name: Independent Task C source/hash/share QA
on:
  push:
    paths:
      - ".github/workflows/eurostat_task_c_independent_qa.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify archived official responses, missingness, market shares and supplier HHI bounds
        run: python task_c_competitor_data/qa_task_c_full.py
      - name: Archive independent validation evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task_c_competitor_data/full/INDEPENDENT_QA_RESULT.json task_c_competitor_data/full/supplier_concentration_bounded_2025.csv
          if ! git diff --staged --quiet; then
            git commit -m "Save independent Task C official data validation and supplier concentration"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
