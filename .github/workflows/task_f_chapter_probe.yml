name: Task F official Chapter 61-63 all-partner probe
on:
  push:
    paths:
      - ".github/workflows/task_f_chapter_probe.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chapter:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve chapter 61-63 2025 official Eurostat all-partner values
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,csv,io,hashlib,json,pathlib,datetime,gzip
          dest=pathlib.Path("task_f_empirical/article33_probe");dest.mkdir(parents=True,exist_ok=True)
          base="https://ec.europa.eu/eurostat/api/comext/dissemination/sdmx/2.1/data/DS-045409/"
          reqs=[("chapters_2025","A.EU27_2020..61+62+63.1.VALUE_IN_EUROS","2025"),
                ("chapters_bd_2025","A.EU27_2020.BD.61+62+63.1.VALUE_IN_EUROS","2025"),
                ("chapters_2023","A.EU27_2020..61+62+63.1.VALUE_IN_EUROS","2023")]
          res=[]
          for name,key,year in reqs:
            url=base+key+f"?format=SDMX-CSV&startPeriod={year}&endPeriod={year}"
            record={'name':name,'url':url,'retrieved_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"University-of-Dhaka-MITB-Article33/1.0"}),timeout=80) as r:
                data=r.read(15000000);record['http_status']=r.status
              row=list(csv.DictReader(io.StringIO(data.decode('utf-8-sig'))))
              record.update({'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'rows':len(row),
                 'header':list(row[0]) if row else [],'products':sorted(set(z['product'] for z in row)) if row else [],
                 'bd':[{k:x[k] for k in ('product','partner','TIME_PERIOD','OBS_VALUE')} for x in row if x['partner']=='BD'],
                 'extra':[{k:x[k] for k in ('product','partner','OBS_VALUE')} for x in row if x['partner']=='EXT_EU27_2020']})
              (dest/(name+".csv.gz")).write_bytes(gzip.compress(data,compresslevel=6))
            except Exception as exc:record['error']=str(exc)[:600]
            res.append(record)
            print(json.dumps({k:v for k,v in record.items() if k not in ('bd','extra')},indent=2),flush=True)
          (dest/'receipts.json').write_text(json.dumps(res,indent=2))
          PY
      - name: Commit official article33 probe
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task_f_empirical/article33_probe/
          if ! git diff --staged --quiet; then
            git commit -m "Capture official Eurostat Chapter61-63 GSP safeguard source probe"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
