name: Task E official EU TARIC CIRCABC probe
on:
  push:
    paths:
      - ".github/workflows/task_e_circabc_probe.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read official monthly TARIC catalogue metadata
        run: python task_e_tariff_matrix/circabc_probe.py
      - name: Archive official catalogue response and provenance
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task_e_tariff_matrix/probe/
          if ! git diff --staged --quiet; then
            git commit -m "Archive official EU TARIC catalogue evidence for Task E"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
